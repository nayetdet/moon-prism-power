apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          securityContext:
            fsGroup: 65532
          restartPolicy: Never
          {{- if .Values.reports.persistence.enabled }}
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-reports
          {{- end }}
          containers:
            - name: moon-prism-power
              image: ghcr.io/nayetdet/moon-prism-power:latest
              imagePullPolicy: Always
              {{- if .Values.reports.persistence.enabled }}
              volumeMounts:
                - name: reports
                  mountPath: /app/data
              {{- end }}
              env:
                - name: AUTO_CONFIRM
                  value: {{ .Values.migration.autoConfirm | quote }}
              envFrom:
                - secretRef:
                    name: {{ required "secrets.application.name is required" .Values.secrets.application.name | quote }}
